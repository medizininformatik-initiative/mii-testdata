[IG]
; MII KDS Testdaten IG.
; template: vendored MII-Template (ig-template/, aus ig-template-mii-kds),
; wie bei den KDS-Modul-Repos — das publizierte Package
; de.medizininformatikinitiative.template ist noch in keiner Registry.
; Nie eine Version floaten (#current) — Reproduzierbarkeit.
; Der Dateiname folgt der IG-`id` aus sushi-config.yaml. Sie wurde in 52ffac1d
; in den MII-Namensraum gehoben, diese Zeile blieb stehen — der IG Publisher
; ist daraufhin 14 Laeufe lang an einer NoSuchFileException gescheitert.
; Wer die `id` aendert, muss diese Zeile mitaendern.
ig = fsh-generated/resources/ImplementationGuide-de.medizininformatikinitiative.kerndatensatz.testdata.json
template = #ig-template
