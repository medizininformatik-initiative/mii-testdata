<!-- Branding override for the fhir2.base.template header placeholder
     (base ships includes/fragment-header.html as a single comment; it is included
     inside "#segment-header > .container", before the #ig-status block).
     Language handling: only the asset and its descriptive alt text switch on
     include.lang (the pattern kerndatensatz-basis uses); no translatable UI
     strings are hard-coded.
     Brand handling: the project logo additionally switches on
     site.data.brand.design (input/data/brand.json in the consuming IG, see
     docs/styleguide.md §10). Only the exact value 'mii' selects the MII
     logos - anything else, including no brand.json at all, falls through to
     the NUM-DIZ default.
     Two logos, mirroring kerndatensatz-basis: the HL7 FHIR logo (links to the
     FHIR spec) in #family-nav, and the project logo in #project-nav.
     fhir-logo-www.png is shipped by fhir2.base.template
     (content/assets/images/), so it resolves from the inherited assets without
     shipping it here. -->
<div id="family-nav">
  <a id="family-logo" no-external="true" href="https://hl7.org/fhir">
    <img height="50" alt="HL7 FHIR" src="{{site.data.info.assets}}assets/images/fhir-logo-www.png"/>
  </a>
</div>
<div id="project-nav">
{% if site.data.brand.design == 'mii' %}
  <a id="project-logo" no-external="true" href="https://www.medizininformatik-initiative.de/">
{% if include.lang == 'de' %}
    <img height="50" alt="Medizininformatik-Initiative (MII)" src="{{site.data.info.assets}}assets/images/logo-de.svg"/>
{% else %}
    <img height="50" alt="Medical Informatics Initiative (MII)" src="{{site.data.info.assets}}assets/images/logo-en.svg"/>
{% endif %}
  </a>
{% else %}
  <a id="project-logo" no-external="true" href="https://www.netzwerk-universitaetsmedizin.de/forschung/num-diz">
{% if include.lang == 'de' %}
    <img height="50" alt="NUM-DIZ (Netzwerk Universitätsmedizin — Datenintegrationszentrum)" src="{{site.data.info.assets}}assets/images/logo-num-diz-de.svg"/>
{% else %}
    <img height="50" alt="NUM-DIZ (Network of University Medicine — Data Integration Center)" src="{{site.data.info.assets}}assets/images/logo-num-diz-en.svg"/>
{% endif %}
  </a>
{% endif %}
</div>
<!-- Font-size control (A / A+ / A++): three reader-selectable levels; level A
     is the untouched default. Logic in assets/js/font-size-control.js, the
     zoom mapping + button styling in template-base.css ("font-size control"
     block). All three buttons read "A" — the button's own font size shows the level; labels are language-neutral; only the aria texts switch
     on include.lang. REMOVAL: delete this block, the js file and the CSS
     block - one commit, styleguide §5a. -->
{% if include.lang == 'de' %}
<div class="ig-fontsize" role="group" aria-label="Schriftgröße">
  <button type="button" data-level="0" aria-pressed="true" aria-label="Schriftgröße: Standard">A</button>
  <button type="button" data-level="1" aria-pressed="false" aria-label="Schriftgröße: größer">A</button>
  <button type="button" data-level="2" aria-pressed="false" aria-label="Schriftgröße: am größten">A</button>
</div>
{% else %}
<div class="ig-fontsize" role="group" aria-label="Font size">
  <button type="button" data-level="0" aria-pressed="true" aria-label="Font size: default">A</button>
  <button type="button" data-level="1" aria-pressed="false" aria-label="Font size: larger">A</button>
  <button type="button" data-level="2" aria-pressed="false" aria-label="Font size: largest">A</button>
</div>
{% endif %}
<script src="{{site.data.info.assets}}assets/js/font-size-control.js" defer></script>
<!-- PayPal Bootstrap Accessibility Plugin v1.0.7 (vendored + pinned, §8):
     patches the Bootstrap-3 components the publisher renders - navbar
     dropdowns gain ARIA menu semantics + arrow-key navigation, tab panels
     (structure-tabs) the full ARIA tabs pattern, alerts live-region
     announcements. `defer` guarantees it executes AFTER the parser-inserted
     bootstrap.min.js at the end of the body. Vendored from
     paypal/bootstrap-accessibility-plugin @ v1.0.7 (the admin-ch fork was
     evaluated and rejected: 151 commits behind upstream, its 6 deltas are
     site-specific tab tweaks). REMOVAL: delete this tag, both vendored
     assets and the fragment-css link - guard test pins the hashes. -->
<script src="{{site.data.info.assets}}assets/js/bootstrap-accessibility.min.js" defer></script>
<!-- Back-to-top button: appears after one viewport of scrolling (logic in
     assets/js/back-to-top.js, styling in template-base.css "back-to-top"
     block). Rendered here inside #segment-header, which is OUTSIDE the
     data-fontsize zoom regions, so the fixed button never scales. REMOVAL:
     this block, the js file and the CSS block - one commit, styleguide §8. -->
{% if include.lang == 'de' %}
<button type="button" class="ig-back-to-top" aria-label="Zurück zum Seitenanfang">↑</button>
{% else %}
<button type="button" class="ig-back-to-top" aria-label="Back to top">↑</button>
{% endif %}
<script src="{{site.data.info.assets}}assets/js/back-to-top.js" defer></script>
