# FHIR-Validierung mit dem HL7-Java-Validator.
#
# WARUM NICHT der wiederverwendbare MII-Workflow (ci_java_validation.yml), wie
# in den Modulen:
#
# Er ruft `java -jar validator_cli.jar` ohne Heap-Angabe auf, es gilt also der
# JVM-Default von einem Viertel des Arbeitsspeichers — auf einem Standard-Runner
# mit 16 GB sind das 4 GB. Fuer dieses Repo reicht das nicht: 1202 Instanzen
# gegen 33 IGs in einem Aufruf brauchen ~14 GB. Reproduziert am 2026-09-26,
# Lauf 36228145711:
#
#     Exception in thread "main" java.lang.OutOfMemoryError: Java heap space
#         at InstanceValidator.start(InstanceValidator.java:6625)
#
# Der Validator stirbt nach 1:44 beim ersten Datensatz, ohne Ausgabedatei. Lokal
# mit -Xmx4g exakt derselbe Abbruch, mit -Xmx14g laeuft derselbe Satz in 85
# Sekunden durch. Ein `uses:`-Job nimmt kein `env:`, und `env` des aufrufenden
# Workflows wird nicht weitergegeben — es gibt von hier aus also keinen Weg,
# -Xmx oder JAVA_TOOL_OPTIONS hineinzureichen. Die Module laufen durch, weil ein
# Modul rund 300 Conformance-Ressourcen hat statt 1200 Instanzen.
#
# Sobald ci_java_validation.yml eine Heap-Einstellung erlaubt, kann dieser
# Workflow durch den Aufruf ersetzt werden; bis dahin ist er die Bedingung
# dafuer, dass hier ueberhaupt validiert wird.
#
# OHNE Terminologieserver (`-tx n/a`), und das ist eine Entscheidung, keine
# Ausrede: Mit dem SU-TermServ dominierte dessen Expansions-Latenz alles. Am
# 2026-09-25 lief die Validierung sechs Stunden und wurde von GitHubs Deckel
# abgeschnitten, ohne Ergebnis; einzelne Ressourcen brauchten ueber sechs
# Minuten, waehrend der Rest in ein bis zwei Sekunden durchlief. Ein Ergebnis
# nach 85 Sekunden, das jeder ohne Zertifikat nachrechnen kann, ist mehr wert
# als eines, das von der Tageslaune eines Servers abhaengt.
# Terminologische Fehler bleiben nicht unbemerkt: Die haeufigste Klasse —
# falsche Displays — faengt das statische Gate scripts/check-displays.py in
# ci.yml ab, und zwar in Sekunden.
#
# Bekannte Profildefekte werden ueber kds-testdata/advisor.json unterdrueckt;
# welche und warum, steht auf der Known-Issues-Seite des IG.
#
# Schalter: vars.ENABLE_VALIDATION — standardmaessig an, 'false' schaltet ab.
name: FHIR validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Nachts fuer den terminologiegestuetzten Lauf (siehe Job java-validation-tx).
    - cron: "17 2 * * *"

permissions:
  contents: read

env:
  VALIDATOR_VERSION: 6.9.11
  # Zahl aus Lauf 36255001163 in DIESER Umgebung. Verlauf: 1696 vor dem
  # Merge von PR #48, 1883 danach (vier modulübergreifende Patienten bringen
  # 187 Fehler mit, praktisch ausschliesslich dieselben Profildefekte an neuen
  # Instanzen), 917 seit die beiden pfadlosen Advisor-Regeln auch die
  # Bundle-Sicht erreichen.
  #
  # Die Zahl ist zweimal gemessen worden, und der Umweg lohnt die Notiz: Ein
  # Zwischenstand meldete 1885, weil eine Display-'Korrektur' von mir zwei
  # Fehler HINZUFUEGTE (siehe 2b2388cc). Haette ich die Baseline damals auf die
  # gemeldete Zahl gesetzt, waeren die beiden Fehler zum Normalzustand
  # geworden. Eine Baseline gehoert auf eine Zahl, die man versteht. Der Job schlaegt an, wenn sie
  # STEIGT — die absolute Hoehe ist eine Aussage ueber die Ballot-Profile, keine
  # ueber die Testdaten, und ein dauerhaft roter Job wird ignoriert statt
  # gelesen.
  #
  # Die Zahl gilt nur fuer einen Lauf OHNE Terminologieserver, und das ist
  # ueberpruefbar: Derselbe Validator (6.9.11) ueber dieselben Ressourcen ergibt
  # lokal 1887 und hier 1696. Die 191 Fehler Differenz sind restlos
  # terminologischer Natur — 131 Kommunikationsfehler gegen tx.fhir.org
  # (SocketTimeout, verwaiste cache-id), 38 ValueSet-Mitgliedschaftspruefungen,
  # 16 Display-Pruefungen. Ein lokaler `~/.fhir` mit Terminologie-Cache
  # kontaktiert tx.fhir.org auch bei `-tx n/a`; der frische Cache hier nicht.
  #
  # Die strukturellen Klassen sind dabei bis auf die Zahl identisch (SLICING
  # 379/379, MatchMultiple 446/446, Minimum_SLICE 232/232) — genau das ist die
  # Annahme, auf der dieser Job beruht, und sie ist damit gemessen.
  #
  # Was dieser Lauf dafuer NICHT sieht: ValueSet-Mitgliedschaft. 38 Codes, die
  # ihre Bindung verletzen, bleiben hier unsichtbar (u.a. 26x 'MII VS Prozedur
  # Durchfuehrungsabsicht'). Das ist der Preis der Reproduzierbarkeit und keine
  # Behauptung, die Daten seien terminologisch sauber.
  #
  # Verglichen wird deshalb ausschliesslich CI-Lauf gegen CI-Lauf; eine lokale
  # Zahl taugt zur Orientierung, nicht als Baseline.
  #
  # Nach jeder Aenderung am Datenbestand oder an den Paket-Pins neu erheben:
  # den Lauf ansehen, die gemeldete Zahl hier eintragen, und im Commit sagen
  # warum sie sich bewegt hat.
  ERROR_BASELINE: 917

jobs:
  java-validation:
    name: HL7 Java validator
    if: ${{ vars.ENABLE_VALIDATION != 'false' }}
    runs-on: ubuntu-latest
    # Ohne Terminologieserver liegt die Laufzeit bei ~2 min inkl. Setup. Der
    # knappe Deckel macht aus einem haengenden Validator eine klare Aussage,
    # statt ihn bis zum 6-Stunden-Default stehen zu lassen.
    timeout-minutes: 20
    steps:
    - name: Checkout Project
      uses: actions/checkout@v4

    # Die Pakete kommen aus dem MII-Paketspeicher statt aus der Registry: Die
    # BOM ist nirgends publiziert, und der Speicher haelt ausserdem die
    # Snapshot-Varianten (z.B. de.gematik.isik#6.0.0), die die Registry nicht
    # liefert.
    - name: Download FHIR cache
      uses: actions/checkout@v4
      with:
        repository: medizininformatik-initiative/fhir-package-store
        ref: cache-store
        path: .fhir

    - name: Link .fhir cache to ~/.fhir
      run: |
        mkdir -p ~/.fhir
        cp -r .fhir/* ~/.fhir/

    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "17"

    - name: Cache validator jar
      uses: actions/cache@v4
      with:
        path: validator_cli.jar
        key: validator-jar-${{ env.VALIDATOR_VERSION }}

    - name: Download validator
      run: |
        [ -f validator_cli.jar ] || curl -fsSL -o validator_cli.jar \
          "https://github.com/hapifhir/org.hl7.fhir.core/releases/download/${VALIDATOR_VERSION}/validator_cli.jar"

    - name: Validate
      run: |
        set -o pipefail
        # Die -ig-Liste kommt aus package.json — dieselbe Quelle, die der
        # MII-Workflow benutzt. sushi-config.yaml deklariert stattdessen die BOM;
        # der Validator kann sie nicht aus einer Registry ziehen, deshalb zaehlt
        # package.json die Module einzeln auf. Beide Dateien muessen daher im
        # Gleichschritt gepflegt werden.
        IGS=$(jq -r '.dependencies | to_entries | map("-ig " + .key + "#" + .value) | join(" ")' \
                kds-testdata/package.json)
        RES="$GITHUB_WORKSPACE/kds-testdata/fsh-generated/resources"
        # -Xmx14g: siehe Kopf dieser Datei. Mit dem Default stirbt der Lauf.
        java -Xmx14g -jar validator_cli.jar "$RES"/*.json \
          -version 4.0.1 $IGS -ig "$RES" -tx n/a \
          -advisor-file kds-testdata/advisor.json \
          -output "$GITHUB_WORKSPACE/validation.json" || true
        # `|| true` faengt nur den erwarteten Exit!=0 bei Validierungsfehlern ab.
        # Ein Abbruch VOR der Validierung hinterlaesst keine Ausgabedatei — und
        # genau das muss den Job rot machen, sonst laeuft er ins Leere. Der
        # OutOfMemoryError oben hat exakt so ausgesehen.
        [ -s validation.json ] || {
          echo "::error::Validator ohne Ergebnis — validation.json fehlt. Log pruefen (Heap? Paket nicht aufloesbar?)"
          exit 1
        }

    - name: Report and compare against baseline
      run: |
        set -o pipefail
        N=$(python3 - <<'PY'
        import json
        d = json.load(open("validation.json"))
        entries = d.get("entry", []) if d.get("resourceType") == "Bundle" else [{"resource": d}]
        n = sum(1 for e in entries for i in e["resource"].get("issue", [])
                if i.get("severity") in ("error", "fatal"))
        print(n)
        PY
        )
        echo "### FHIR validation: $N Errors (Baseline $ERROR_BASELINE)" >> "$GITHUB_STEP_SUMMARY"
        python3 scripts/advisor-rules.py validation.json --top 12 >> "$GITHUB_STEP_SUMMARY"
        if [ "$N" -gt "$ERROR_BASELINE" ]; then
          echo "::error::$N Errors, Baseline ist $ERROR_BASELINE — die Zahl ist GESTIEGEN. Entweder eine echte Regression, oder ein Profil-Update hat neue Fehler gebracht; dann die Baseline mit Begruendung anheben."
          exit 1
        fi
        echo "::notice::$N Errors (Baseline $ERROR_BASELINE) — nicht gestiegen."

    - name: Upload validation report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: validation-report
        path: validation.json
        retention-days: 14
        compression-level: 9

  # Derselbe Datenbestand, aber MIT dem SU-TermServ. Der schnelle Lauf oben ist
  # das Tor; dieser hier holt zurueck, was das Tor nicht sehen kann.
  #
  # Wie viel das ist, ist gemessen: Von 917 Fehlern des terminologiefreien Laufs
  # sind 231 (25 %) terminologiebedingt. Der Kern davon sind die
  # ICD-O-3-Wertemengen der Onkologie, definiert ueber
  # `filter: concept descendent-of 'T'` auf einem CodeSystem mit
  # `content: not-present` — sie koennen ohne Terminologieserver NIE expandieren,
  # also ist per Konstruktion kein Code darin. Der SU-TermServ hat ICD-O-3.
  # Dazu kommt die Verstaerkung: Eine Condition mit zwei solchen Fehlern
  # erzeugte 89 Referenzfehler an anderen Stellen.
  #
  # Warum NICHT bei jedem Push: Die Laufzeit haengt an der Antwortzeit des
  # Servers und schwankte am 2026-09-25 zwischen 12 Minuten und ueber sechs
  # Stunden (GitHub-Deckel, ohne Ergebnis). Deshalb naechtlich und auf Abruf,
  # mit eigenem Deckel, und vorerst NICHT blockierend — er berichtet, er
  # verhindert nicht. Sobald seine Laufzeit ueber mehrere Wochen stabil ist,
  # kann er ein Tor mit eigener Baseline werden.
  #
  # Der Proxy ist ein anderer als in den uebrigen Workflows: Er cacht auch
  # POST-Antworten und fuehrt abgebrochene Upstream-Anfragen zu Ende. Beides ist
  # notwendig und beides war im ersten Versuch falsch — die Begruendung steht in
  # su-termserv-nginx-cache.conf.
  java-validation-tx:
    name: HL7 Java validator (mit SU-TermServ)
    if: ${{ vars.ENABLE_VALIDATION != 'false' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    continue-on-error: true
    steps:
    - name: Checkout Project
      uses: actions/checkout@v4

    - name: Download FHIR cache
      uses: actions/checkout@v4
      with:
        repository: medizininformatik-initiative/fhir-package-store
        ref: cache-store
        path: .fhir

    - name: Link .fhir cache to ~/.fhir
      run: |
        mkdir -p ~/.fhir
        cp -r .fhir/* ~/.fhir/

    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "17"

    - name: Start SU-TermServ proxy
      id: tx
      env:
        CERT: ${{ secrets.CDS_DEV_CLIENT_CERT }}
        KEY: ${{ secrets.CDS_DEV_CLIENT_KEY }}
        PASS: ${{ secrets.CDS_DEV_CLIENT_CERT_PASSWORD }}
      run: |
        if [ -z "$CERT" ] || [ -z "$KEY" ] || [ -z "$PASS" ]; then
          echo "::warning::Kein SU-TermServ-Zertifikat — dieser Job hat ohne Terminologieserver keinen Zweck und wird uebersprungen."
          echo "tx=" >> "$GITHUB_OUTPUT"; exit 0
        fi
        mkdir -p nginx/certs
        echo "$CERT" | base64 -d > nginx/certs/client-cert.pem
        echo "$KEY"  | base64 -d > nginx/certs/client-key-encrypted.key
        openssl rsa -in nginx/certs/client-key-encrypted.key \
          -out nginx/certs/client-key.key -passin env:PASS
        docker run -d --name nginx-tx \
          -v "$PWD/.github/workflows/su-termserv-nginx-cache.conf:/etc/nginx/nginx.conf:ro" \
          -v "$PWD/nginx/certs:/etc/nginx/certs:ro" \
          -p 8090:80 nginx:alpine
        sleep 5
        # Warmlauf mit dem Accept-Header des Validators, damit Readiness-Check
        # und Validator denselben Cache-Eintrag treffen (der Server schickt
        # `Vary: Accept`).
        if curl -fsS -o /dev/null -H "Accept: application/fhir+json" \
             --max-time 300 "http://127.0.0.1:8090/fhir/metadata"; then
          echo "tx=http://127.0.0.1:8090/fhir" >> "$GITHUB_OUTPUT"
        else
          echo "::warning::SU-TermServ nicht erreichbar — Job ohne Aussage."
          echo "tx=" >> "$GITHUB_OUTPUT"
        fi

    - name: Cache validator jar
      if: steps.tx.outputs.tx != ''
      uses: actions/cache@v4
      with:
        path: validator_cli.jar
        key: validator-jar-${{ env.VALIDATOR_VERSION }}

    - name: Download validator
      if: steps.tx.outputs.tx != ''
      run: |
        [ -f validator_cli.jar ] || curl -fsSL -o validator_cli.jar \
          "https://github.com/hapifhir/org.hl7.fhir.core/releases/download/${VALIDATOR_VERSION}/validator_cli.jar"

    - name: Validate with terminology
      if: steps.tx.outputs.tx != ''
      env:
        TX: ${{ steps.tx.outputs.tx }}
      run: |
        IGS=$(jq -r '.dependencies | to_entries | map("-ig " + .key + "#" + .value) | join(" ")' \
                kds-testdata/package.json)
        RES="$GITHUB_WORKSPACE/kds-testdata/fsh-generated/resources"
        # -Xmx14g wie beim schnellen Lauf; -authorise-non-conformant-tx-servers,
        # weil validator_cli den SU-TermServ sonst ablehnt und mit 1 endet.
        java -Xmx14g -jar validator_cli.jar "$RES"/*.json \
          -version 4.0.1 $IGS -ig "$RES" \
          -tx "$TX" -authorise-non-conformant-tx-servers \
          -advisor-file kds-testdata/advisor.json \
          -output "$GITHUB_WORKSPACE/validation-tx.json" || true
        [ -s validation-tx.json ] || {
          echo "::warning::Kein Ergebnis — Terminologieserver zu langsam oder Lauf abgebrochen."
          exit 0
        }

    - name: Report
      if: steps.tx.outputs.tx != '' && hashFiles('validation-tx.json') != ''
      run: |
        N=$(python3 - <<'PY'
        import json
        d = json.load(open("validation-tx.json"))
        entries = d.get("entry", []) if d.get("resourceType") == "Bundle" else [{"resource": d}]
        print(sum(1 for e in entries for i in e["resource"].get("issue", [])
                  if i.get("severity") in ("error", "fatal")))
        PY
        )
        {
          echo "### Mit SU-TermServ: $N Errors"
          echo
          echo "Der terminologiefreie Lauf meldet ${ERROR_BASELINE}. Die Differenz ist die"
          echo "Aussage dieses Jobs — was nur mit Terminologieserver sichtbar ist, in beide"
          echo "Richtungen: Bindungsverletzungen, die dort auffallen, und Wertemengen, die"
          echo "ohne Server gar nicht expandieren koennen."
        } >> "$GITHUB_STEP_SUMMARY"
        python3 scripts/advisor-rules.py validation-tx.json --top 14 >> "$GITHUB_STEP_SUMMARY"

    - name: Stop proxy
      if: always()
      run: docker rm -f nginx-tx 2>/dev/null || true

    - name: Upload report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: validation-report-tx
        path: |
          validation-tx.json
        retention-days: 14
        if-no-files-found: warn
        compression-level: 9
