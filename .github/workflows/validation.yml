# FHIR-Validierung mit dem HL7-Java-Validator.
#
# WARUM NICHT der wiederverwendbare MII-Workflow (ci_java_validation.yml), wie
# in den Modulen:
#
# Er ruft `java -jar validator_cli.jar` ohne Heap-Angabe auf, es gilt also der
# JVM-Default von einem Viertel des Arbeitsspeichers — auf einem Standard-Runner
# mit 16 GB sind das 4 GB. Fuer dieses Repo reicht das nicht: 1202 Instanzen
# gegen 33 IGs in einem Aufruf brauchen ~14 GB. Reproduziert am 2026-09-26,
# Lauf 36228145711:
#
#     Exception in thread "main" java.lang.OutOfMemoryError: Java heap space
#         at InstanceValidator.start(InstanceValidator.java:6625)
#
# Der Validator stirbt nach 1:44 beim ersten Datensatz, ohne Ausgabedatei. Lokal
# mit -Xmx4g exakt derselbe Abbruch, mit -Xmx14g laeuft derselbe Satz in 85
# Sekunden durch. Ein `uses:`-Job nimmt kein `env:`, und `env` des aufrufenden
# Workflows wird nicht weitergegeben — es gibt von hier aus also keinen Weg,
# -Xmx oder JAVA_TOOL_OPTIONS hineinzureichen. Die Module laufen durch, weil ein
# Modul rund 300 Conformance-Ressourcen hat statt 1200 Instanzen.
#
# Sobald ci_java_validation.yml eine Heap-Einstellung erlaubt, kann dieser
# Workflow durch den Aufruf ersetzt werden; bis dahin ist er die Bedingung
# dafuer, dass hier ueberhaupt validiert wird.
#
# OHNE Terminologieserver (`-tx n/a`), und das ist eine Entscheidung, keine
# Ausrede: Mit dem SU-TermServ dominierte dessen Expansions-Latenz alles. Am
# 2026-09-25 lief die Validierung sechs Stunden und wurde von GitHubs Deckel
# abgeschnitten, ohne Ergebnis; einzelne Ressourcen brauchten ueber sechs
# Minuten, waehrend der Rest in ein bis zwei Sekunden durchlief. Ein Ergebnis
# nach 85 Sekunden, das jeder ohne Zertifikat nachrechnen kann, ist mehr wert
# als eines, das von der Tageslaune eines Servers abhaengt.
# Terminologische Fehler bleiben nicht unbemerkt: Die haeufigste Klasse —
# falsche Displays — faengt das statische Gate scripts/check-displays.py in
# ci.yml ab, und zwar in Sekunden.
#
# Bekannte Profildefekte werden ueber kds-testdata/advisor.json unterdrueckt;
# welche und warum, steht auf der Known-Issues-Seite des IG.
#
# Schalter: vars.ENABLE_VALIDATION — standardmaessig an, 'false' schaltet ab.
name: FHIR validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  VALIDATOR_VERSION: 6.9.11
  # Gemessene Obergrenze der letzten Laeufe: 2687 Errors ohne advisor.json,
  # 1867 mit. Der Job schlaegt an, wenn die Zahl STEIGT — die absolute Hoehe ist
  # eine Aussage ueber die Ballot-Profile, keine ueber die Testdaten, und ein
  # dauerhaft roter Job wird ignoriert statt gelesen.
  ERROR_BASELINE: 1867

jobs:
  java-validation:
    name: HL7 Java validator
    if: ${{ vars.ENABLE_VALIDATION != 'false' }}
    runs-on: ubuntu-latest
    # Ohne Terminologieserver liegt die Laufzeit bei ~2 min inkl. Setup. Der
    # knappe Deckel macht aus einem haengenden Validator eine klare Aussage,
    # statt ihn bis zum 6-Stunden-Default stehen zu lassen.
    timeout-minutes: 20
    steps:
    - name: Checkout Project
      uses: actions/checkout@v4

    # Die Pakete kommen aus dem MII-Paketspeicher statt aus der Registry: Die
    # BOM ist nirgends publiziert, und der Speicher haelt ausserdem die
    # Snapshot-Varianten (z.B. de.gematik.isik#6.0.0), die die Registry nicht
    # liefert.
    - name: Download FHIR cache
      uses: actions/checkout@v4
      with:
        repository: medizininformatik-initiative/fhir-package-store
        ref: cache-store
        path: .fhir

    - name: Link .fhir cache to ~/.fhir
      run: |
        mkdir -p ~/.fhir
        cp -r .fhir/* ~/.fhir/

    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "17"

    - name: Cache validator jar
      uses: actions/cache@v4
      with:
        path: validator_cli.jar
        key: validator-jar-${{ env.VALIDATOR_VERSION }}

    - name: Download validator
      run: |
        [ -f validator_cli.jar ] || curl -fsSL -o validator_cli.jar \
          "https://github.com/hapifhir/org.hl7.fhir.core/releases/download/${VALIDATOR_VERSION}/validator_cli.jar"

    - name: Validate
      run: |
        set -o pipefail
        # Die -ig-Liste kommt aus package.json — dieselbe Quelle, die der
        # MII-Workflow benutzt. sushi-config.yaml deklariert stattdessen die BOM;
        # der Validator kann sie nicht aus einer Registry ziehen, deshalb zaehlt
        # package.json die Module einzeln auf. Beide Dateien muessen daher im
        # Gleichschritt gepflegt werden.
        IGS=$(jq -r '.dependencies | to_entries | map("-ig " + .key + "#" + .value) | join(" ")' \
                kds-testdata/package.json)
        RES="$GITHUB_WORKSPACE/kds-testdata/fsh-generated/resources"
        # -Xmx14g: siehe Kopf dieser Datei. Mit dem Default stirbt der Lauf.
        java -Xmx14g -jar validator_cli.jar "$RES"/*.json \
          -version 4.0.1 $IGS -ig "$RES" -tx n/a \
          -advisor-file kds-testdata/advisor.json \
          -output "$GITHUB_WORKSPACE/validation.json" || true
        # `|| true` faengt nur den erwarteten Exit!=0 bei Validierungsfehlern ab.
        # Ein Abbruch VOR der Validierung hinterlaesst keine Ausgabedatei — und
        # genau das muss den Job rot machen, sonst laeuft er ins Leere. Der
        # OutOfMemoryError oben hat exakt so ausgesehen.
        [ -s validation.json ] || {
          echo "::error::Validator ohne Ergebnis — validation.json fehlt. Log pruefen (Heap? Paket nicht aufloesbar?)"
          exit 1
        }

    - name: Report and compare against baseline
      run: |
        set -o pipefail
        N=$(python3 - <<'PY'
        import json
        d = json.load(open("validation.json"))
        entries = d.get("entry", []) if d.get("resourceType") == "Bundle" else [{"resource": d}]
        n = sum(1 for e in entries for i in e["resource"].get("issue", [])
                if i.get("severity") in ("error", "fatal"))
        print(n)
        PY
        )
        echo "### FHIR validation: $N Errors (Baseline $ERROR_BASELINE)" >> "$GITHUB_STEP_SUMMARY"
        python3 scripts/advisor-rules.py validation.json --top 12 >> "$GITHUB_STEP_SUMMARY"
        if [ "$N" -gt "$ERROR_BASELINE" ]; then
          echo "::error::$N Errors, Baseline ist $ERROR_BASELINE — die Zahl ist GESTIEGEN. Entweder eine echte Regression, oder ein Profil-Update hat neue Fehler gebracht; dann die Baseline mit Begruendung anheben."
          exit 1
        fi
        echo "::notice::$N Errors (Baseline $ERROR_BASELINE) — nicht gestiegen."

    - name: Upload validation report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: validation-report
        path: validation.json
        retention-days: 14
        compression-level: 9
