# IG Publish — baut den Testdaten-IG (IG Publisher) und deployt ihn nach
# GitHub Pages. Bewusst schlanker als das ig-publisher.yml des
# mii-kds-module-template (keine Branch-Previews, kein vendored ig-template,
# kein go-publish — Testdaten sind kein formal publizierter IG).
#
# Besonderheiten:
# - Die BOM de.medizininformatikinitiative.kerndatensatz.complete ist in keiner
#   Registry publiziert. Der IG Publisher prueft Cache-Pakete gegen die
#   Registries und RAEUMT nicht verifizierbare Eintraege WEG. Deshalb wird das
#   tgz aus dem fhir-package-store per `-packages <dir>` direkt geladen
#   (laedt *.tgz vor der Dependency-Aufloesung).
# - Terminologie: -tx n/a (deterministisch, kein Secret noetig). QA-Werte sind
#   entsprechend ohne Terminologie-Verdicts zu lesen; die massgebliche
#   Validierung laeuft in ci.yml (JAVA_FHIR_VALIDATION gegen SU-TermServ).
#
# Deployment: Push des Publisher-Outputs auf den gh-pages-Branch
# (Pages-Source: branch gh-pages, wie bei den KDS-Modul-Repos).
name: IG Publish

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["kds-testdata/**"]

permissions:
  contents: write

concurrency:
  group: ig-publish
  cancel-in-progress: false

env:
  SUSHI_VERSION: 3.20.1
  PUBLISHER_VERSION: 2.3.4

jobs:
  build:
    runs-on: ubuntu-latest
    # Deckel fuer beide Build-Versuche (2x 50 min) plus Setup/Deploy.
    timeout-minutes: 140
    steps:
    - name: Checkout Project
      uses: actions/checkout@v4

    - name: Download FHIR cache (inkl. complete-BOM tgz)
      uses: actions/checkout@v4
      with:
        repository: medizininformatik-initiative/fhir-package-store
        ref: cache-store
        path: .fhir

    - name: Link .fhir cache to ~/.fhir
      run: |
        mkdir -p ~/.fhir
        cp -r .fhir/* ~/.fhir/

    - name: Stage unpublished packages for -packages
      # cache-store entpackt die Tarballs nach packages/; fuer -packages brauchen
      # wir die tgz-Datei selbst — sie liegt im main-Branch des Store-Repos.
      run: |
        mkdir -p local-packages
        pkg="de.medizininformatikinitiative.kerndatensatz.complete"
        ver="$(yq eval '.dependencies["'$pkg'"].version' kds-testdata/sushi-config.yaml)"
        curl -fsSL -o "local-packages/${pkg}-${ver}.tgz" \
          "https://raw.githubusercontent.com/medizininformatik-initiative/fhir-package-store/main/package-tarballs/${pkg}-${ver}.tgz"
        tar -tzf "local-packages/${pkg}-${ver}.tgz" >/dev/null
        # Auch in den SUSHI-Cache entpacken (der eingebettete SUSHI des
        # Publishers kennt -packages nicht; Store-Extraktion zerlegt
        # Bindestrich-Versionen falsch)
        target="$HOME/.fhir/packages/${pkg}#${ver}"
        rm -rf "$target" && mkdir -p "$target"
        tar -xzf "local-packages/${pkg}-${ver}.tgz" -C "$target"

    - name: Install yq
      run: |
        wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
        chmod +x /usr/local/bin/yq

    - name: Install sushi
      run: npm install -g fsh-sushi@${SUSHI_VERSION}

    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "17"

    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: "3.3"

    - name: Install jekyll
      run: gem install jekyll --no-document

    - name: Cache IG Publisher jar
      id: cache-publisher
      uses: actions/cache@v4
      with:
        path: publisher.jar
        key: publisher-jar-${{ env.PUBLISHER_VERSION }}

    - name: Download IG Publisher
      if: steps.cache-publisher.outputs.cache-hit != 'true'
      run: |
        curl -fsSL -o publisher.jar \
          "https://github.com/HL7/fhir-ig-publisher/releases/download/${PUBLISHER_VERSION}/publisher.jar"

    # Terminologie-Cache des Publishers (kds-testdata/input-cache/txcache)
    # zwischen Laeufen persistieren — der Grossteil der Buildzeit sind
    # tx-Roundtrips; der Cache waechst fortlaufend (run_id-Key + Prefix-Restore).
    - name: Cache terminology responses
      uses: actions/cache@v4
      with:
        path: kds-testdata/input-cache
        key: ig-txcache-v1-${{ github.run_id }}
        restore-keys: |
          ig-txcache-v1-

    - name: Generate Testabdeckung status include
      # Misst die MS-Abdeckung gegen den in sushi-config gepinnten BOM-Stand
      # und schreibt den Status-Include fuer testabdeckung.md frisch.
      working-directory: ./kds-testdata
      run: |
        mkdir -p input/includes
        python3 ../scripts/ms-coverage.py           --ig-include input/includes/testabdeckung-status.md           --index ../docs/ms-coverage-index.json > /dev/null
        # Interaktive Luecken-Uebersicht aus demselben Index
        python3 ../scripts/build-gap-page.py input/includes/ms-luecken.html

    - name: Start SU-TermServ proxy (falls Zertifikat vorhanden)
      id: tx
      env:
        CDS_DEV_CLIENT_CERT: ${{ secrets.CDS_DEV_CLIENT_CERT }}
        CDS_DEV_CLIENT_KEY: ${{ secrets.CDS_DEV_CLIENT_KEY }}
        CDS_DEV_CLIENT_CERT_PASSWORD: ${{ secrets.CDS_DEV_CLIENT_CERT_PASSWORD }}
      # Template-Muster (kerndatensatz-lungenfunktion/ig-publisher.yml):
      # SU-TermServ wenn moeglich, sonst oeffentlicher HL7-Server —
      # MII-ValueSets expandieren dann ggf. unvollstaendig (QA-Hinweis, kein Fehler).
      run: |
        if [ -z "$CDS_DEV_CLIENT_CERT" ]; then
          echo "tx=https://tx.fhir.org" >> "$GITHUB_OUTPUT"
          echo "::notice::Kein SU-TermServ-Zertifikat — Fallback auf https://tx.fhir.org."
          exit 0
        fi
        mkdir -p nginx/certs
        echo "$CDS_DEV_CLIENT_CERT" | base64 -d > nginx/certs/client-cert.pem
        echo "$CDS_DEV_CLIENT_KEY" | base64 -d > nginx/certs/client-key-encrypted.key
        openssl rsa -in nginx/certs/client-key-encrypted.key \
          -out nginx/certs/client-key.key -passin env:CDS_DEV_CLIENT_CERT_PASSWORD
        docker run -d --name nginx-proxy \
          -v "$PWD/.github/workflows/su-termserv-nginx.conf:/etc/nginx/nginx.conf:ro" \
          -v "$PWD/nginx/certs:/etc/nginx/certs:ro" \
          -p 8090:80 nginx:alpine
        sleep 5
        # Warmlauf MIT dem Accept-Header des Validators: nginx respektiert ein
          # Vary: Accept des Servers, sonst landen Readiness-Check und
          # Validator in getrennten Cache-Eintraegen und der Warmlauf verpufft.
          curl -fsS -o /dev/null -H "Accept: application/fhir+json" \
            --max-time 300 "http://127.0.0.1:8090/fhir/metadata" \
          && echo "tx=http://127.0.0.1:8090/fhir" >> "$GITHUB_OUTPUT" \
          || { echo "::warning::SU-TermServ-Proxy nicht erreichbar — Fallback tx.fhir.org"; echo "tx=https://tx.fhir.org" >> "$GITHUB_OUTPUT"; }

    - name: Build IG
      working-directory: ./kds-testdata
      env:
        TX: ${{ steps.tx.outputs.tx }}
      run: |
        # -fhir-settings allowlistet den lokalen SU-TermServ-Proxy
        # (http://127.0.0.1:8090) gegen die SSRF-Haertung des Publishers
        # (2.3.1+ verweigert sonst plain-HTTP/private-network -tx; Muster
        # aus dem mii-kds-module-template).
        # Ein gesunder Lauf braucht ~25 min; alles darueber ist ein haengender
        # Terminologie-Call. Ohne Deckel laeuft der Job ins 6h-Limit und der
        # Fallback greift nie (er triggert nur bei Exit!=0, nicht bei Haenger).
        build() {
          timeout 50m java -Xmx6g -Dfile.encoding=UTF-8 -jar ../publisher.jar \
            -ig . -tx "$1" -packages ../local-packages \
            -fhir-settings "$GITHUB_WORKSPACE/.github/fhir-settings.json"
        }
        # SU-TermServ zeigt gelegentlich Timeouts (CapabilityStatement) —
        # ein Fehlschlag faellt auf den oeffentlichen HL7-Server zurueck
        # (QA dann mit unvollstaendigen MII-Expansions, aber Build steht).
        build "$TX" || { echo "::warning::Build mit $TX fehlgeschlagen/abgebrochen — Retry mit https://tx.fhir.org"; build "https://tx.fhir.org"; }

    - name: Stop SU-TermServ proxy
      if: always()
      run: docker rm -f nginx-proxy 2>/dev/null || true

    - name: Summarize QA
      if: always()
      run: |
        if [ -f kds-testdata/output/qa.json ]; then
          jq -r '"QA: \(.errs) errors, \(.warnings) warnings, \(.hints) hints"' \
            kds-testdata/output/qa.json >> "$GITHUB_STEP_SUMMARY" || true
        fi

    - name: Archive full QA report
      if: always()
      run: |
        if [ -f kds-testdata/output/qa.html ]; then
          gzip -9 -c kds-testdata/output/qa.html > qa-full.html.gz
        fi

    - name: Upload full QA report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: qa-report
        path: qa-full.html.gz
        if-no-files-found: ignore

    - name: Deploy to gh-pages
      run: |
        set -euo pipefail
        cd kds-testdata/output
        # Pages-Budget: schwergewichtige Redundanzen nicht deployen.
        # qa.html (verlinkt) bleibt; qa.min/qa-tx/qa.xml sind Duplikate (~100 MB).
        rm -f qa.min.html qa-tx.html qa.xml
        # GitHub lehnt Einzeldateien >100 MB ab (pre-receive hook). Bei
        # tx-Fallback schwillt qa.html durch nicht-expandierbare MII-ValueSets
        # auf ~180 MB an -> durch eine Stub-Seite ersetzen, Vollreport haengt
        # als Artefakt am Workflow-Lauf.
        if [ -f qa.html ] && [ "$(stat -c%s qa.html)" -gt 94371840 ]; then
          size_mb=$(( $(stat -c%s qa.html) / 1048576 ))
          echo "::warning::qa.html ist ${size_mb} MB (>90 MB) — wird durch Stub ersetzt"
          cat > qa.html <<EOF
        <!doctype html><meta charset="utf-8"><title>QA-Report zu gross</title>
        <h1>QA-Report nicht eingebettet</h1>
        <p>Der vollstaendige QA-Report dieses Builds ist <strong>${size_mb} MB</strong> gross und
        ueberschreitet das Dateigroessen-Limit von GitHub (100 MB).</p>
        <p>Er haengt als Artefakt <code>qa-report</code> am erzeugenden Workflow-Lauf:
        <a href="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}">Run ${GITHUB_RUN_ID}</a>.</p>
        <p>Ein derart grosser Report entsteht typischerweise, wenn der Build auf den
        oeffentlichen Terminologieserver zurueckfallen musste und MII-ValueSets
        nicht expandiert werden konnten — dann erzeugt praktisch jedes Coding eine Warnung.</p>
        EOF
        fi
        touch .nojekyll
        git init -q -b gh-pages
        git add -A
        git -c user.email=github-actions[bot]@users.noreply.github.com \
            -c user.name=github-actions[bot] \
            commit -qm "IG build ${GITHUB_SHA::8}"
        git push -q --force \
          "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
          gh-pages:gh-pages
      env:
        GITHUB_TOKEN: ${{ github.token }}
