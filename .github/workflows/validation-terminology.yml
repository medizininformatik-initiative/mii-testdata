# Terminologiegestuetzte Validierung gegen den SU-TermServ.
#
# EIGENER WORKFLOW und nicht Teil von validation.yml, aus zwei beobachteten
# Gruenden:
#
#   1. Der Status am Commit. Der schnelle Prueflauf ist nach fuenf Minuten
#      fertig, diese Matrix braucht Stunden. Solange beide im selben Workflow
#      stecken, bleibt dessen Status stundenlang offen und das Tor ist nicht
#      ablesbar. Beobachtet an Lauf 36266671490: `HL7 Java validator` grün um
#      19:37, der Workflow noch um 20:27 auf `queued`.
#
#   2. Die Last auf dem Terminologieserver. `max-parallel: 1` begrenzt nur
#      INNERHALB eines Laufs. Am 2026-09-26 liefen zwei Laeufe von
#      validation.yml gleichzeitig (ein Dispatch und ein Push) — also zwei
#      gleichzeitige Validatoren gegen den SU-TermServ, obwohl die Absicht
#      genau das Gegenteil war. Die `concurrency`-Gruppe unten stellt sicher,
#      dass es repoweit nur einen gibt.
#
# Warum die Arbeit ueberhaupt zerlegt wird und warum nur die Bundles laufen:
# siehe scripts/tx-matrix.py — dort stehen die Messungen.
#
# NICHT blockierend: Der Job berichtet, er verhindert nicht. Ein Tor kann er
# nicht werden, solange seine Laufzeit an der Antwortzeit eines fremden Servers
# haengt (beobachtet: 10 Minuten fuer ein Bundle, ueber 50 fuer ein anderes
# ähnlicher Groesse).
name: FHIR validation (terminology)

# KEIN `push`-Auslöser, und das ist eine Korrektur aus Beobachtung.
#
# Dieser Lauf braucht Stunden, und die concurrency-Gruppe unten laesst nur
# einen zu. Mit `push` stellte jeder Commit auf main einen weiteren in die
# Schlange, und weil GitHub je Gruppe nur EINEN Wartenden haelt und aeltere
# Wartende verwirft, verdraengten sich die Laeufe gegenseitig: Zwischen
# 2026-09-26 20:29 und 2026-09-27 06:30 kam KEIN einziger Lauf zum Ergebnis —
# fuenf abgebrochen, einer zehn Stunden in `queued` haengend, und der Cron um
# 02:17 erzeugte ueberhaupt keinen Lauf. Das Tueckische daran: Ein Lauf, der
# nicht startet, erzeugt keinen roten Status und keine Meldung. Er ist
# unsichtbar.
#
# Auf einem Push nach main ist der schnelle Lauf (validation.yml) ohnehin schon
# durch; der terminologiegestuetzte Bericht ist eine naechtliche Angelegenheit.
# Bei PRs bleibt er, weil sie selten sind und Terminologie-Rueckmeldung dort
# etwas wert ist — dafuer war die inkrementelle Paketauswahl gedacht.
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

# Repoweit nur ein terminologiegestuetzter Lauf. `cancel-in-progress: false`,
# weil ein halb fertiger naechtlicher Lauf mehr wert ist als ein neu
# gestarteter — der Push wartet, statt den laufenden abzuraeumen.
concurrency:
  group: validation-terminology
  cancel-in-progress: false

env:
  VALIDATOR_VERSION: 6.9.11

jobs:
  # INKREMENTELL bei PRs, VOLLSTAENDIG naechtlich und auf Abruf.
  #
  # Das ist zulaessig, weil ein Bundle seine Ressourcen vollstaendig einbettet:
  # Wer eine Ressource aendert, aendert auch jedes Bundle, das sie enthaelt —
  # nachgeprueft an 716fdee4, der die Observation UND Bundle-…-seltene-1.json
  # anfasste. Ein Paket, dessen Dateien unveraendert sind, kann kein neues
  # Ergebnis liefern.
  #
  # Ausnahme sind Aenderungen, die jedes Paket betreffen: die -ig-Liste und
  # damit alle Profil- und Terminologieversionen (package.json), die
  # Projektkonfiguration, die Unterdrueckungen, die Paketbildung selbst. Genau
  # dort sitzen auch die SNOMED- und LOINC-Pins. Die Liste steht in
  # scripts/tx-matrix.py, damit die Regel an einer Stelle gepflegt wird.
  #
  # Erst dadurch ist dieser Job auf einem PR ueberhaupt bezahlbar: ein
  # geaendertes Bundle kostet rund eine Viertelstunde statt Stunden. Auf Push
  # laeuft er gar nicht mehr — siehe die Begruendung am `on:`-Block.
  tx-pakete:
    name: Arbeitspakete bestimmen
    if: ${{ vars.ENABLE_VALIDATION != 'false' }}
    runs-on: ubuntu-latest
    outputs:
      pakete: ${{ steps.m.outputs.pakete }}
    steps:
    - uses: actions/checkout@v4
      with:
        # Fuer den Vergleich mit dem Vorzustand; ohne Historie kein Diff.
        fetch-depth: 0

    - name: Geaenderte Dateien bestimmen
      id: diff
      env:
        EVENT: ${{ github.event_name }}
        BASE: ${{ github.base_ref }}
        BEFORE: ${{ github.event.before }}
      run: |
        case "$EVENT" in
          schedule|workflow_dispatch)
            echo "::notice::Vollstaendiger Lauf ($EVENT)."
            exit 0 ;;
          pull_request)
            git fetch --quiet origin "$BASE"
            git diff --name-only "origin/$BASE...HEAD" > /tmp/changed.txt ;;
          *)
            # Bei einem neuen Branch ist `before` der Null-SHA; dann gibt es
            # keinen Vorzustand und alles muss laufen.
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              echo "::notice::Kein Vorzustand (neuer Branch) — vollstaendiger Lauf."
              exit 0
            fi
            git diff --name-only "$BEFORE" "$GITHUB_SHA" > /tmp/changed.txt ;;
        esac
        echo "liste=/tmp/changed.txt" >> "$GITHUB_OUTPUT"
        echo "$(wc -l < /tmp/changed.txt) Dateien geaendert:"
        cat /tmp/changed.txt

    - id: m
      env:
        LISTE: ${{ steps.diff.outputs.liste }}
      run: |
        if [ -n "$LISTE" ]; then
          set -- --changed "$LISTE"
        fi
        echo "pakete=$(python3 scripts/tx-matrix.py kds-testdata/fsh-generated/resources "$@")" \
          >> "$GITHUB_OUTPUT"

  java-validation-tx:
    name: "tx: ${{ matrix.paket.name }}"
    needs: tx-pakete
    # Eine leere Matrix ist ein Fehler bei GitHub, kein Ueberspringen — also
    # hier abfangen. Tritt ein, sobald ein Commit keine Testdaten beruehrt.
    if: ${{ needs.tx-pakete.outputs.pakete != '[]' }}
    runs-on: ubuntu-latest
    # Je Paket. Das groesste Bundle (icu-1, 183 Eintraege) lag beim Vollauf bei
    # rund einer halben Stunde; 120 Minuten lassen reichlich Luft, ohne einen
    # Haenger unbegrenzt stehen zu lassen.
    timeout-minutes: 120
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        paket: ${{ fromJSON(needs.tx-pakete.outputs.pakete) }}
    steps:
    - name: Checkout Project
      uses: actions/checkout@v4

    - name: Download FHIR cache
      uses: actions/checkout@v4
      with:
        repository: medizininformatik-initiative/fhir-package-store
        ref: cache-store
        path: .fhir

    - name: Link .fhir cache to ~/.fhir
      run: |
        mkdir -p ~/.fhir
        cp -r .fhir/* ~/.fhir/

    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "17"

    - name: Start SU-TermServ proxy
      id: tx
      env:
        CERT: ${{ secrets.CDS_DEV_CLIENT_CERT }}
        KEY: ${{ secrets.CDS_DEV_CLIENT_KEY }}
        PASS: ${{ secrets.CDS_DEV_CLIENT_CERT_PASSWORD }}
      run: |
        if [ -z "$CERT" ] || [ -z "$KEY" ] || [ -z "$PASS" ]; then
          echo "::warning::Kein SU-TermServ-Zertifikat — dieser Job hat ohne Terminologieserver keinen Zweck."
          echo "tx=" >> "$GITHUB_OUTPUT"; exit 0
        fi
        mkdir -p nginx/certs
        echo "$CERT" | base64 -d > nginx/certs/client-cert.pem
        echo "$KEY"  | base64 -d > nginx/certs/client-key-encrypted.key
        openssl rsa -in nginx/certs/client-key-encrypted.key \
          -out nginx/certs/client-key.key -passin env:PASS
        docker run -d --name nginx-tx \
          -v "$PWD/.github/workflows/su-termserv-nginx.conf:/etc/nginx/nginx.conf:ro" \
          -v "$PWD/nginx/certs:/etc/nginx/certs:ro" \
          -p 8090:80 nginx:alpine
        sleep 5
        if curl -fsS -o /dev/null -H "Accept: application/fhir+json" \
             --max-time 300 "http://127.0.0.1:8090/fhir/metadata"; then
          echo "tx=http://127.0.0.1:8090/fhir" >> "$GITHUB_OUTPUT"
        else
          echo "::warning::SU-TermServ nicht erreichbar — Paket ohne Aussage."
          echo "tx=" >> "$GITHUB_OUTPUT"
        fi

    - name: Cache validator jar
      if: steps.tx.outputs.tx != ''
      uses: actions/cache@v4
      with:
        path: validator_cli.jar
        key: validator-jar-${{ env.VALIDATOR_VERSION }}

    # Der Validator fragt seriell, und diese Wartezeit IST die Laufzeit des
    # Jobs: Im Lauf 36301663856 entfielen von den 2,0 Stunden des Pakets
    # mikrobio-1 genau 1,9 Stunden auf 449 Anfragen an den SU-TermServ
    # (Beleg im Proxy-Protokoll, Artefakt nginx-tx-7). Davon waren 380
    # erfolgreich und kosteten zusammen rund 45 Minuten — und dieselben
    # Wertemengen werden in jedem Paket und in jeder Nacht erneut gefragt.
    # Ein Antwortcache schneidet diese 45 Minuten weg; er ist der Unterschied
    # zwischen dem Timeout und einem Ergebnis. Die 69 Anfragen, die je 60
    # Sekunden in den Client-Timeout liefen, bleiben davon unberuehrt —
    # Fehlschlaege landen nicht im Cache.
    #
    # Je Paket ein eigener Schluessel, denn im naechtlichen Vollauf validiert
    # ein Paketname immer dieselben Dateien; sein eigener Cache von gestern
    # passt also besser als der irgendeines anderen Pakets. Die generische
    # restore-key-Stufe faengt neue Pakete ab. `github.run_id` im Schluessel
    # sorgt dafuer, dass der Cache ueberhaupt fortgeschrieben wird: Bei einem
    # exakten Treffer speichert actions/cache nicht. Dieselbe Bauart wie bei
    # der Advisor-Kontrolle in ci.yml.
    - name: Cache terminology responses
      if: steps.tx.outputs.tx != ''
      uses: actions/cache@v4
      with:
        path: .txcache
        key: tx-cache-v1-${{ matrix.paket.name }}-${{ github.run_id }}
        restore-keys: |
          tx-cache-v1-${{ matrix.paket.name }}-
          tx-cache-v1-

    - name: Download validator
      if: steps.tx.outputs.tx != ''
      run: |
        [ -f validator_cli.jar ] || curl -fsSL -o validator_cli.jar \
          "https://github.com/hapifhir/org.hl7.fhir.core/releases/download/${VALIDATOR_VERSION}/validator_cli.jar"

    - name: Validate with terminology
      if: steps.tx.outputs.tx != ''
      env:
        TX: ${{ steps.tx.outputs.tx }}
        FILES: ${{ matrix.paket.files }}
      run: |
        IGS=$(jq -r '.dependencies | to_entries | map("-ig " + .key + "#" + .value) | join(" ")' \
                kds-testdata/package.json)
        RES="$GITHUB_WORKSPACE/kds-testdata/fsh-generated/resources"
        # Die Dateien dieses Pakets, absolut. FILES ist leerzeichengetrennt und
        # enthaelt nur von tx-matrix.py erzeugte Dateinamen — kein Nutzereingabe.
        ziele=""
        for f in $FILES; do ziele="$ziele $RES/$f"; done
        # -ig auf das ganze Verzeichnis, damit Referenzen ausserhalb des Pakets
        # aufloesen; validiert wird aber nur, was in $ziele steht.
        # -authorise-non-conformant-tx-servers, weil validator_cli den
        # SU-TermServ sonst ablehnt und mit 1 endet.
        # -txCache braucht einen ABSOLUTEN Pfad; an einem relativen ../-Pfad
        # stirbt der Validator mit "Computed path does not start with first
        # element" (derselbe Fallstrick wie in ci.yml).
        mkdir -p "$GITHUB_WORKSPACE/.txcache"
        java -Xmx14g -jar validator_cli.jar $ziele \
          -version 4.0.1 $IGS -ig "$RES" \
          -tx "$TX" -authorise-non-conformant-tx-servers \
          -txCache "$GITHUB_WORKSPACE/.txcache" \
          -advisor-file kds-testdata/advisor.json \
          -output "$GITHUB_WORKSPACE/validation-tx.json" || true
        [ -s validation-tx.json ] || {
          echo "::warning::Kein Ergebnis fuer ${{ matrix.paket.name }} — Server zu langsam oder Lauf abgebrochen."
          exit 0
        }

    - name: Report
      if: steps.tx.outputs.tx != '' && hashFiles('validation-tx.json') != ''
      run: |
        N=$(python3 - <<'PY'
        import json
        d = json.load(open("validation-tx.json"))
        entries = d.get("entry", []) if d.get("resourceType") == "Bundle" else [{"resource": d}]
        print(sum(1 for e in entries for i in e["resource"].get("issue", [])
                  if i.get("severity") in ("error", "fatal")))
        PY
        )
        echo "### ${{ matrix.paket.name }} — $N Errors mit SU-TermServ" >> "$GITHUB_STEP_SUMMARY"
        python3 scripts/advisor-rules.py validation-tx.json --top 8 >> "$GITHUB_STEP_SUMMARY"

    # Das Zugriffsprotokoll des Proxys landet im Container, nicht im Job-Log.
    # Ohne diesen Schritt ist nicht feststellbar, ob die Keepalive-Einstellung in
    # su-termserv-nginx.conf ueberhaupt wirkt — genau die Frage, die dieser Job
    # beantworten soll. Ein erster Versuch dieser Statistik existierte in
    # b916d78f und ist beim Umbau auf die Matrix (060429e3) verlorengegangen;
    # daraufhin liess sich die erste Messung nicht deuten.
    - name: Proxy-Statistik und Abbau
      if: always()
      run: |
        if docker inspect nginx-tx >/dev/null 2>&1; then
          docker logs nginx-tx > /tmp/nginx-tx.log 2>&1 || true
          # Der Body steht in einer Datei IM Container, nicht auf stdout.
          docker cp nginx-tx:/tmp/tx-bodies.log /tmp/tx-bodies.log 2>/dev/null || true
          # Welche Wertemengen liefen in den 60-Sekunden-Timeout?
          if [ -s /tmp/tx-bodies.log ]; then
            {
              echo
              echo "Wertemengen mit Antwortzeit >= 60 s:"
              echo '```'
              grep 'response=6[0-9]\.' /tmp/tx-bodies.log \
                | grep -oE '"valueUri":"[^"]*ValueSet[^"]*"' \
                | cut -d'"' -f4 | sort | uniq -c | sort -rn | head -12
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          n=$(grep -cE '"(GET|POST|HEAD) ' /tmp/nginx-tx.log || true)
          {
            echo "### Terminologie-Proxy — ${{ matrix.paket.name }}"
            echo
            echo "$n Anfragen. Nach Status:"
            echo '```'
            grep -oE '" [0-9]{3} ' /tmp/nginx-tx.log | tr -d '" ' | sort | uniq -c | sort -rn | head
            echo '```'
            echo "Verbindungsaufbau (connect=): 0.000 heisst wiederverwendet."
            echo '```'
            null=$(grep -cE 'connect=0\.000' /tmp/nginx-tx.log || true)
            neu=$(grep -oE 'connect=[0-9.]+' /tmp/nginx-tx.log | grep -vc '=0\.000' || true)
            echo "wiederverwendet: $null    neu aufgebaut: $neu"
            echo "Summe Verbindungsaufbau in Sekunden:"
            grep -oE 'connect=[0-9.]+' /tmp/nginx-tx.log | cut -d= -f2 \
              | awk '{s+=$1} END {printf "  %.1f s\n", s}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          docker rm -f nginx-tx >/dev/null 2>&1 || true
        fi

    - name: Upload proxy log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: nginx-tx-${{ strategy.job-index }}
        path: |
          /tmp/nginx-tx.log
          /tmp/tx-bodies.log
        retention-days: 7
        if-no-files-found: ignore

    - name: Upload report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        # Artefaktname je Paket eindeutig, sonst kollidieren die Matrix-Jobs.
        name: validation-tx-${{ strategy.job-index }}
        path: validation-tx.json
        retention-days: 14
        if-no-files-found: ignore
        compression-level: 9
