name: Build and Validate Testdata

on:
  push:
    branches:
    - main
    tags:
    - v[0-9]+.[0-9]+.[0-9]+**
  pull_request:
    branches:
    - main
  workflow_dispatch:
    inputs:
      run_validation:
        description: 'Run JAVA FHIR Validation'
        required: false
        default: true
        type: boolean

jobs:
  build-kds-testdata:
    runs-on: ubuntu-latest
    outputs:
      artifact-url: ${{ steps.upload-artifact.outputs.artifact-url }}
    steps:
    - name: Checkout Project
      uses: actions/checkout@v4

    #- name: Cache FHIR Packages
    #  id: fhir-cache
    #  uses: actions/cache@v4
    #  with:
    #    path: "~/.fhir"
    #    key: fhir-cache

    - name: Download FHIR cache
      uses: actions/checkout@v4
      with:
        repository: medizininformatik-initiative/fhir-package-store
        ref: cache-store
        path: .fhir

    - name: Link .fhir cache to ~/.fhir
      run: |
        mkdir -p ~/.fhir
        cp -r .fhir/* ~/.fhir/

    - name: Install yq
      run: |
        wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64
        chmod +x /usr/local/bin/yq
      env:
        YQ_VERSION: v4.44.3

    - name: Install sushi
      run: npm install -g fsh-sushi@${SUSHI_VERSION}
      env:
        SUSHI_VERSION: 3.20.1

    # Seit der 2027-Ballot-Generation liefern die KDS-Pakete Snapshots mit;
    # der fruehere ICU-inflate-Workaround (Firely Terminal) ist entfernt.
    # Alle MII-Module kommen ueber die BOM de.medizininformatikinitiative.
    # kerndatensatz.complete aus dem fhir-package-store Cache.
    - name: Build
      run: sushi build --log-level warn .
      working-directory: ./kds-testdata

    - name: Generate timestamp
      id: timestamp
      run: echo "timestamp=$(date -u +'%Y%m%d-%H%M%S')" >> "$GITHUB_OUTPUT"

    - name: Get KDS Testdata Version
      id: kds-version
      run: echo KDS_VERSION="$(yq eval '.' sushi-config.yaml -o json | jq -r '.version')" >> "$GITHUB_OUTPUT"
      working-directory: ./kds-testdata

    - name: Fetch additional ICU test bundle
      if: false  # Temporarily disabled because there are invalid resources in that bundle
      continue-on-error: true
      run: |
        echo "Attempting to fetch ICU test bundle..."
        if curl -fsSL https://raw.githubusercontent.com/medizininformatik-initiative/kerndatensatzmodul-intensivmedizin/example_data/fsh-generated/resources/Bundle-mii-icu-test-data-bundle-ect-dauer-extrakorporaler-gasaustausch.json \
          -o ./kds-testdata/fsh-generated/resources/Bundle-mii-icu-test-data-bundle-ect-dauer-extrakorporaler-gasaustausch.json; then
          echo "✅ ICU test bundle fetched successfully"
        else
          echo "⚠️  Failed to fetch ICU test bundle - continuing without it"
          exit 0
        fi
      shell: bash

    - name: Upload generated FHIR resources as artifact
      id: upload-artifact
      uses: actions/upload-artifact@v4
      with:
        name: "kds-testdata-${{ steps.kds-version.outputs.KDS_VERSION }}-${{ steps.timestamp.outputs.timestamp }}"
        path: ./kds-testdata/fsh-generated
        compression-level: 9
        if-no-files-found: error

    - name: Generate NDJSON from test data bundles
      id: ndjson
      run: |
        mkdir -p ./kds-testdata/ndjson
        timestamp="${{ steps.timestamp.outputs.timestamp }}"
        output_file="./kds-testdata/ndjson/testdata-bundles-${timestamp}.ndjson"
        > "$output_file"

        for file in ./kds-testdata/fsh-generated/resources/Bundle-mii-exa-test-data-bundle-*.json; do
          if [ -f "$file" ]; then
            jq -c '.' "$file" >> "$output_file"
          fi
        done

        echo "ndjson_filename=testdata-bundles-${timestamp}.ndjson" >> "$GITHUB_OUTPUT"
      shell: bash

    - name: Upload test data bundles NDJSON
      uses: actions/upload-artifact@v4
      with:
        name: "testdata-bundles-ndjson-${{ steps.timestamp.outputs.timestamp }}"
        path: ./kds-testdata/ndjson/${{ steps.ndjson.outputs.ndjson_filename }}
        compression-level: 9
        if-no-files-found: error

  blaze-transaction-test:
    runs-on: ubuntu-latest
    needs: build-kds-testdata
    steps:
    - name: Checkout Project
      uses: actions/checkout@v4

    - name: Download FHIR resources artifact
      uses: actions/download-artifact@v4
      with:
        pattern: "kds-testdata-*"
        path: ./kds-testdata/fsh-generated
        merge-multiple: true

    - name: Start Blaze FHIR server
      run: docker compose -f blaze/blaze.yml up -d --wait

    - name: POST bundles as transactions
      run: blaze/load-bundles.sh ./kds-testdata/fsh-generated/resources

    - name: Stop Blaze
      if: always()
      run: docker compose -f blaze/blaze.yml down -v

  # Die aufgerufene Workflow-Definition deklariert ihre Secrets als required;
  # fehlen sie (z.B. in Forks), stirbt der Job ohne einen einzigen Step.
  # Der Guard prueft die Verfuegbarkeit vorab (Muster: kerndatensatz-lungenfunktion).
  java-validation-guard:
    runs-on: ubuntu-latest
    needs: build-kds-testdata
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_validation == 'true') ||
      github.event_name == 'pull_request' ||
      startsWith(github.ref, 'refs/tags/v') ||
      contains(github.event.head_commit.message, '[validate]')
    outputs:
      has-secrets: ${{ steps.check.outputs.has-secrets }}
    steps:
    - id: check
      run: echo "has-secrets=${{ env.CERT != '' }}" >> "$GITHUB_OUTPUT"
      env:
        CERT: ${{ secrets.CDS_DEV_CLIENT_CERT }}

  JAVA_FHIR_VALIDATION:
    # Auf Commit-SHA gepinnt statt @master (Reproduzierbarkeit; Muster der Modul-Repos)
    uses: medizininformatik-initiative/kerndatensatz-meta/.github/workflows/ci_java_validation.yml@1db2e534704d92e5ee0cde663ce3e7ccd8825fa7
    needs: java-validation-guard
    if: needs.java-validation-guard.outputs.has-secrets == 'true'
    with:
      ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
      PATH_TO_CONFORMANCE_RESOURCES: ./kds-testdata/fsh-generated/resources
      PATH_TO_EXAMPLES: ./kds-testdata/fsh-generated/resources
      JAVA_VALIDATION_ENABLED: true
      JAVA_VALIDATION_OPTIONS: ${{ vars.JAVA_VALIDATION_OPTIONS }}
      JAVA_VALIDATOR_VERSION: ${{ vars.JAVA_VALIDATOR_VERSION }}
      working-directory: ./kds-testdata
    secrets: inherit

  release:
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs:
    - build-kds-testdata
    steps:
    - name: Checkout Project
      uses: actions/checkout@v4

    - name: Generate timestamp for release
      id: timestamp
      run: echo "timestamp=$(date -u +'%Y%m%d-%H%M%S')" >> "$GITHUB_OUTPUT"

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Zip each artifact
      run: |
        for a in *
        do
          zip -9qqr "$a.zip" "$a"
        done
      working-directory: artifacts

#    Step is unnecessary because ndjson file is already provided as zip artifact
#    - name: Add NDJSON file to release
#      run: |
#        cp artifacts/testdata-bundles-ndjson-*/testdata-bundles-*.ndjson ./testdata-bundles-${{ steps.timestamp.outputs.timestamp }}.ndjson

    - name: Prepare Version
      id: prep-version
      run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

    - name: Release
      uses: softprops/action-gh-release@v1
      with:
        name: "MII Testdata - ${{ steps.prep-version.outputs.version }}"
        draft: true
        prerelease: ${{ contains(steps.prep-version.outputs.version, '-') }}
        generate_release_notes: true
        files: |
          artifacts/*.zip
        fail_on_unmatched_files: true
