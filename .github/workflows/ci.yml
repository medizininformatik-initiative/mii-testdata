name: Build and Validate Testdata

on:
  push:
    branches:
    - main
    tags:
    - v[0-9]+.[0-9]+.[0-9]+**
  pull_request:
    branches:
    - main
  workflow_dispatch:
    inputs:
      run_validation:
        description: 'Run JAVA FHIR Validation'
        required: false
        default: true
        type: boolean

jobs:
  build-kds-testdata:
    runs-on: ubuntu-latest
    outputs:
      artifact-url: ${{ steps.upload-artifact.outputs.artifact-url }}
    steps:
    - name: Checkout Project
      uses: actions/checkout@v4

    #- name: Cache FHIR Packages
    #  id: fhir-cache
    #  uses: actions/cache@v4
    #  with:
    #    path: "~/.fhir"
    #    key: fhir-cache

    - name: Download FHIR cache
      uses: actions/checkout@v4
      with:
        repository: medizininformatik-initiative/fhir-package-store
        ref: cache-store
        path: .fhir

    - name: Link .fhir cache to ~/.fhir
      run: |
        mkdir -p ~/.fhir
        cp -r .fhir/* ~/.fhir/

    - name: Install yq
      run: |
        wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64
        chmod +x /usr/local/bin/yq
      env:
        YQ_VERSION: v4.44.3

    # Die complete-BOM selbst in den Cache entpacken: der build-cache-Workflow
    # des Stores leitet name#version aus dem DATEINAMEN ab und zerlegt
    # Prerelease-Versionen mit Bindestrich (2027.0.0-ballot.19) falsch.
    # Wir ziehen das tgz direkt aus main und entpacken es korrekt.
    - name: Install complete-BOM into package cache
      run: |
        pkg="de.medizininformatikinitiative.kerndatensatz.complete"
        ver="$(yq eval '.dependencies["'$pkg'"].version' kds-testdata/sushi-config.yaml)"
        target="$HOME/.fhir/packages/${pkg}#${ver}"
        rm -rf "$target" && mkdir -p "$target"
        curl -fsSL "https://raw.githubusercontent.com/medizininformatik-initiative/fhir-package-store/main/package-tarballs/${pkg}-${ver}.tgz"           | tar -xz -C "$target"
        test -f "$target/package/package.json"

    - name: Install sushi
      run: npm install -g fsh-sushi@${SUSHI_VERSION}
      env:
        SUSHI_VERSION: 3.20.1

    # Seit der 2027-Ballot-Generation liefern die KDS-Pakete Snapshots mit;
    # der fruehere ICU-inflate-Workaround (Firely Terminal) ist entfernt.
    # Alle MII-Module kommen ueber die BOM de.medizininformatikinitiative.
    # kerndatensatz.complete aus dem fhir-package-store Cache.
    - name: Build
      run: sushi build --log-level warn .
      working-directory: ./kds-testdata

    # Statische Gates: kosten Sekunden und brauchen kein Docker.
    # check-references faengt absolute Referenzen in Kanonikalraeume — genau
    # den Fall, an dem HAPI scheiterte und Blaze nichts merkte.
    - name: Static checks (codings, references)
      run: |
        python3 scripts/check-coding-quality.py kds-testdata/fsh-generated/resources
        python3 scripts/check-references.py kds-testdata/fsh-generated/resources

    - name: Generate timestamp
      id: timestamp
      run: echo "timestamp=$(date -u +'%Y%m%d-%H%M%S')" >> "$GITHUB_OUTPUT"

    - name: Get KDS Testdata Version
      id: kds-version
      run: echo KDS_VERSION="$(yq eval '.' sushi-config.yaml -o json | jq -r '.version')" >> "$GITHUB_OUTPUT"
      working-directory: ./kds-testdata

    - name: Fetch additional ICU test bundle
      if: false  # Temporarily disabled because there are invalid resources in that bundle
      continue-on-error: true
      run: |
        echo "Attempting to fetch ICU test bundle..."
        if curl -fsSL https://raw.githubusercontent.com/medizininformatik-initiative/kerndatensatzmodul-intensivmedizin/example_data/fsh-generated/resources/Bundle-mii-icu-test-data-bundle-ect-dauer-extrakorporaler-gasaustausch.json \
          -o ./kds-testdata/fsh-generated/resources/Bundle-mii-icu-test-data-bundle-ect-dauer-extrakorporaler-gasaustausch.json; then
          echo "✅ ICU test bundle fetched successfully"
        else
          echo "⚠️  Failed to fetch ICU test bundle - continuing without it"
          exit 0
        fi
      shell: bash

    - name: Upload generated FHIR resources as artifact
      id: upload-artifact
      uses: actions/upload-artifact@v4
      with:
        name: "kds-testdata-${{ steps.kds-version.outputs.KDS_VERSION }}-${{ steps.timestamp.outputs.timestamp }}"
        path: ./kds-testdata/fsh-generated
        compression-level: 9
        if-no-files-found: error

    - name: Generate NDJSON from test data bundles
      id: ndjson
      run: |
        mkdir -p ./kds-testdata/ndjson
        timestamp="${{ steps.timestamp.outputs.timestamp }}"
        output_file="./kds-testdata/ndjson/testdata-bundles-${timestamp}.ndjson"
        > "$output_file"

        for file in ./kds-testdata/fsh-generated/resources/Bundle-mii-exa-test-data-bundle-*.json; do
          if [ -f "$file" ]; then
            jq -c '.' "$file" >> "$output_file"
          fi
        done

        echo "ndjson_filename=testdata-bundles-${timestamp}.ndjson" >> "$GITHUB_OUTPUT"
      shell: bash

    - name: Upload test data bundles NDJSON
      uses: actions/upload-artifact@v4
      with:
        name: "testdata-bundles-ndjson-${{ steps.timestamp.outputs.timestamp }}"
        path: ./kds-testdata/ndjson/${{ steps.ndjson.outputs.ndjson_filename }}
        compression-level: 9
        if-no-files-found: error

  # Ladetest gegen ZWEI Server. Ein einzelner Server uebersieht Datenfehler,
  # die er selbst toleriert: Blaze akzeptierte bundle-pat-1 mit einer absoluten
  # URL als Specimen-Referenz, HAPI wies dasselbe Bundle mit HTTP 400 zurueck
  # (HAPI-0507, externe Referenz). Erst der Vergleich macht solche Faelle sichtbar.
  server-load-test:
    runs-on: ubuntu-latest
    needs: build-kds-testdata
    steps:
    - name: Checkout Project
      uses: actions/checkout@v4

    - name: Download FHIR resources artifact
      uses: actions/download-artifact@v4
      with:
        pattern: "kds-testdata-*"
        path: ./kds-testdata/fsh-generated
        merge-multiple: true

    - name: Load all bundles into Blaze and HAPI
      run: ./scripts/check-servers.sh ./kds-testdata/fsh-generated/resources

    - name: Stop servers
      if: always()
      run: docker compose -f scripts/servers-smoke.yml down -v 2>/dev/null || true

  # Die aufgerufene Workflow-Definition deklariert ihre Secrets als required;
  # fehlen sie (z.B. in Forks), stirbt der Job ohne einen einzigen Step.
  # Der Guard prueft die Verfuegbarkeit vorab (Muster: kerndatensatz-lungenfunktion).
  java-validation-guard:
    runs-on: ubuntu-latest
    needs: build-kds-testdata
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_validation == 'true') ||
      github.event_name == 'pull_request' ||
      startsWith(github.ref, 'refs/tags/v') ||
      contains(github.event.head_commit.message, '[validate]')
    outputs:
      has-secrets: ${{ steps.check.outputs.has-secrets }}
    steps:
    - id: check
      run: echo "has-secrets=${{ env.CERT != '' }}" >> "$GITHUB_OUTPUT"
      env:
        CERT: ${{ secrets.CDS_DEV_CLIENT_CERT }}

  JAVA_FHIR_VALIDATION:
    # Auf Commit-SHA gepinnt statt @master (Reproduzierbarkeit; Muster der Modul-Repos)
    uses: medizininformatik-initiative/kerndatensatz-meta/.github/workflows/ci_java_validation.yml@1db2e534704d92e5ee0cde663ce3e7ccd8825fa7
    needs: java-validation-guard
    if: needs.java-validation-guard.outputs.has-secrets == 'true'
    with:
      ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
      PATH_TO_CONFORMANCE_RESOURCES: ./kds-testdata/fsh-generated/resources
      PATH_TO_EXAMPLES: ./kds-testdata/fsh-generated/resources
      JAVA_VALIDATION_ENABLED: true
      JAVA_VALIDATION_OPTIONS: ${{ vars.JAVA_VALIDATION_OPTIONS }}
      JAVA_VALIDATOR_VERSION: ${{ vars.JAVA_VALIDATOR_VERSION }}
      working-directory: ./kds-testdata
    secrets: inherit


  # Zwei parallele Validierungslaeufe — MIT und OHNE advisor.json — als
  # staendige Kontrolle, welche Fehler der Advisor tatsaechlich wegfiltert
  # (Report in der Job-Summary, Rohdaten als Artefakte). Terminologie laeuft
  # wie beim meta-Workflow ueber den SU-TermServ (nginx-mTLS-Proxy, Konfig
  # vendored in su-termserv-nginx.conf); ohne Secrets Fallback auf -tx n/a.
  # vars.JAVA_VALIDATION_OPTIONS wird wie im meta-Workflow angehaengt.
  validation-advisor-control:
    runs-on: ubuntu-latest
    needs: build-kds-testdata
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_validation == 'true') ||
      github.event_name == 'pull_request' ||
      startsWith(github.ref, 'refs/tags/v') ||
      contains(github.event.head_commit.message, '[validate]')
    env:
      VALIDATOR_VERSION: 6.7.10
    steps:
    - name: Checkout Project
      uses: actions/checkout@v4

    - name: Download FHIR cache
      uses: actions/checkout@v4
      with:
        repository: medizininformatik-initiative/fhir-package-store
        ref: cache-store
        path: .fhir

    - name: Link .fhir cache to ~/.fhir
      run: |
        mkdir -p ~/.fhir
        cp -r .fhir/* ~/.fhir/

    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "17"

    - name: Start SU-TermServ proxy (falls Zertifikat vorhanden)
      id: tx
      env:
        CDS_DEV_CLIENT_CERT: ${{ secrets.CDS_DEV_CLIENT_CERT }}
        CDS_DEV_CLIENT_KEY: ${{ secrets.CDS_DEV_CLIENT_KEY }}
        CDS_DEV_CLIENT_CERT_PASSWORD: ${{ secrets.CDS_DEV_CLIENT_CERT_PASSWORD }}
      run: |
        if [ -z "$CDS_DEV_CLIENT_CERT" ]; then
          echo "tx=n/a" >> "$GITHUB_OUTPUT"
          echo "::notice::Kein SU-TermServ-Zertifikat konfiguriert — Advisor-Kontrolle laeuft mit -tx n/a."
          exit 0
        fi
        mkdir -p nginx/certs
        echo "$CDS_DEV_CLIENT_CERT" | base64 -d > nginx/certs/client-cert.pem
        echo "$CDS_DEV_CLIENT_KEY" | base64 -d > nginx/certs/client-key-encrypted.key
        openssl rsa -in nginx/certs/client-key-encrypted.key \
          -out nginx/certs/client-key.key -passin env:CDS_DEV_CLIENT_CERT_PASSWORD
        docker run -d --name nginx-proxy \
          -v "$PWD/.github/workflows/su-termserv-nginx.conf:/etc/nginx/nginx.conf:ro" \
          -v "$PWD/nginx/certs:/etc/nginx/certs:ro" \
          -p 8090:80 nginx:alpine
        sleep 5
        # Warmlauf MIT dem Accept-Header des Validators: nginx respektiert ein
          # Vary: Accept des Servers, sonst landen Readiness-Check und
          # Validator in getrennten Cache-Eintraegen und der Warmlauf verpufft.
          curl -fsS -o /dev/null -H "Accept: application/fhir+json" \
            --max-time 300 "http://127.0.0.1:8090/fhir/metadata" \
          && echo "tx=http://127.0.0.1:8090/fhir" >> "$GITHUB_OUTPUT" \
          || { echo "::warning::SU-TermServ-Proxy nicht erreichbar — Fallback -tx n/a"; echo "tx=n/a" >> "$GITHUB_OUTPUT"; }

    - name: Cache validator jar
      id: cache-validator
      uses: actions/cache@v4
      with:
        path: validator_cli.jar
        key: validator-jar-${{ env.VALIDATOR_VERSION }}

    - name: Cache terminology responses
      uses: actions/cache@v4
      with:
        path: .txcache
        key: advisor-txcache-v1-${{ github.run_id }}
        restore-keys: |
          advisor-txcache-v1-

    - name: Download validator and complete-BOM tgz
      run: |
        if [ ! -f validator_cli.jar ]; then
        curl -fsSL -o validator_cli.jar \
          "https://github.com/hapifhir/org.hl7.fhir.core/releases/download/${VALIDATOR_VERSION}/validator_cli.jar"
        fi
        pkg="de.medizininformatikinitiative.kerndatensatz.complete"
        ver="$(yq eval '.dependencies["de.medizininformatikinitiative.kerndatensatz.complete"].version' kds-testdata/sushi-config.yaml)"
        curl -fsSL -o complete.tgz \
          "https://raw.githubusercontent.com/medizininformatik-initiative/fhir-package-store/main/package-tarballs/${pkg}-${ver}.tgz"

    - name: Validate (unfiltered + filtered)
      env:
        TX: ${{ steps.tx.outputs.tx }}
        EXTRA_OPTIONS: ${{ vars.JAVA_VALIDATION_OPTIONS }}
      run: |
        mkdir -p "$GITHUB_WORKSPACE/.txcache"
        # JAVA_VALIDATION_OPTIONS ist fuer den meta-Workflow gedacht und
        # enthaelt -advisor-file/-output/-html-output — fuer die Kontrolle
        # rausfiltern, sonst laeuft der "ungefilterte" Lauf MIT Advisor.
        extra=(); skip=0
        for tok in $EXTRA_OPTIONS; do
          if [ "$skip" = 1 ]; then skip=0; continue; fi
          case "$tok" in
            -advisor-file|-output|-html-output) skip=1 ;;
            *) extra+=("$tok") ;;
          esac
        done
        # -txCache braucht einen absoluten Pfad (relative ../-Pfade crashen
        # den Validator: "Computed path does not start with first element").
        common=(fsh-generated/resources -version 4.0.1 \
          -ig ../complete.tgz -ig de.basisprofil.r4#1.6.0 \
          -ig de.einwilligungsmanagement#2.0.4 -ig hl7.fhir.uv.sdc#4.0.0 \
          -ig hl7.fhir.uv.genomics-reporting#3.0.0 -ig eu.miabis.r4#1.3.0 \
          -tx "$TX" -txCache "$GITHUB_WORKSPACE/.txcache" "${extra[@]}")
        cd kds-testdata
        java -Xmx6g -jar ../validator_cli.jar "${common[@]}" \
          -output ../validation-unfiltered.json || true
        java -Xmx6g -jar ../validator_cli.jar "${common[@]}" \
          -advisor-file advisor.json -output ../validation-filtered.json || true
        # || true faengt nur den erwarteten Exit!=0 bei Validierungsfehlern ab.
        # Ein Crash VOR der Validierung hinterlaesst keine Output-Dateien —
        # das muss den Job rot machen, sonst ist die Kontrolle wirkungslos.
        for f in ../validation-unfiltered.json ../validation-filtered.json; do
          [ -s "$f" ] || { echo "::error::Validator-Lauf ohne Ergebnis ($f fehlt) — Log pruefen"; exit 1; }
        done

    - name: Stop SU-TermServ proxy
      if: always()
      run: docker rm -f nginx-proxy 2>/dev/null || true

    - name: Advisor diff report
      run: |
        set -o pipefail
        python3 scripts/compare-advisor-runs.py \
          validation-unfiltered.json validation-filtered.json | tee advisor-diff.md
        cat advisor-diff.md >> "$GITHUB_STEP_SUMMARY"

    - name: Upload validation outputs
      uses: actions/upload-artifact@v4
      with:
        name: validation-advisor-control
        path: |
          validation-unfiltered.json
          validation-filtered.json
          advisor-diff.md
        compression-level: 9

  release:
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs:
    - build-kds-testdata
    steps:
    - name: Checkout Project
      uses: actions/checkout@v4

    - name: Generate timestamp for release
      id: timestamp
      run: echo "timestamp=$(date -u +'%Y%m%d-%H%M%S')" >> "$GITHUB_OUTPUT"

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Zip each artifact
      run: |
        for a in *
        do
          zip -9qqr "$a.zip" "$a"
        done
      working-directory: artifacts

#    Step is unnecessary because ndjson file is already provided as zip artifact
#    - name: Add NDJSON file to release
#      run: |
#        cp artifacts/testdata-bundles-ndjson-*/testdata-bundles-*.ndjson ./testdata-bundles-${{ steps.timestamp.outputs.timestamp }}.ndjson

    - name: Prepare Version
      id: prep-version
      run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

    # FHIR-NPM-Paket als drittes Asset: NDJSON ist das Konsumformat, das
    # fsh-generated-ZIP der Rohstand — das Paket ist die Werkzeugform
    # (`-ig` beim Validator, Aufloesung ueber den Package-Cache).
    # Bewusst hier gebaut und nicht aus ig-publish uebernommen: dort landet es
    # nur auf gh-pages und wird bei jedem Build ueberschrieben, waere also nicht
    # an den getaggten Stand gebunden.
    - name: Build FHIR package
      run: |
        python3 scripts/build-fhir-package.py \
          --version "${{ steps.prep-version.outputs.version }}" --out artifacts

    - name: Release
      uses: softprops/action-gh-release@v1
      with:
        name: "MII Testdata - ${{ steps.prep-version.outputs.version }}"
        draft: true
        prerelease: ${{ contains(steps.prep-version.outputs.version, '-') }}
        generate_release_notes: true
        files: |
          artifacts/*.zip
          artifacts/*.tgz
        fail_on_unmatched_files: true
