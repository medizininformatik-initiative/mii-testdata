# mTLS-Proxy zum SU-TermServ MIT wirksamem Antwort-Cache.
#
# Eigene Konfiguration neben su-termserv-nginx.conf, weil die von
# dependency-check.yml und ig-publish.yml mitbenutzt wird und dort nur kurze
# Einzelabfragen laufen. Hier geht es um einen Validierungslauf mit
# zehntausenden Terminologieabfragen, und der scheiterte bisher an der Laufzeit:
# sechs Stunden bis zum GitHub-Deckel, ohne Ergebnis.
#
# Was dabei gemessen wurde (nginx-Zaehlprotokoll vor tx.fhir.org, derselbe
# Ressourcensatz):
#
#     9  POST /r4/CodeSystem/$validate-code
#     9  GET  /r4/CodeSystem
#     4  POST /r4/ValueSet/$validate-code
#     3  GET  /r4/metadata        ->  12 GET, 13 POST
#
# Daraus folgen drei Dinge, die ein erster Cache-Versuch alle verfehlt hat:
#
#   1. Die HAELFTE der Anfragen sind POSTs, und zwar genau die teuren
#      $validate-code-Aufrufe. Der nginx-Default `proxy_cache_methods GET HEAD`
#      cacht davon nichts.
#   2. POST-Caching braucht den Body im Cache-Key. `$request_body` ist aber nur
#      gefuellt, wenn der Body in den Puffer passt — die Bodies hier sind rund
#      5,7 kB, mit dem Default landen sie in einer Tempdatei, `$request_body`
#      ist leer und ALLE POSTs kollidieren auf einem Key.
#   3. Der Validator bricht langsame Anfragen selbst ab; nginx protokolliert
#      dann `status=499`. Ohne `proxy_ignore_client_abort on` verwirft nginx die
#      Upstream-Antwort mit — der Cache fuellt sich also gerade bei den
#      Anfragen nicht, auf die es ankommt.
#
# Dass POST-Antworten hier gecacht werden duerfen, liegt an der Semantik der
# Operationen: $validate-code und $expand sind Leseoperationen, die per POST
# uebertragen werden, weil der Parameters-Body nicht in eine URL passt. Sie
# haben keine Nebenwirkung, und ihr Ergebnis ist fuer die Dauer eines Laufs
# stabil.
events {
    worker_connections 1024;
}

http {
    log_format tx '$request_method $uri cache=$upstream_cache_status status=$status '
                  'upstream=${upstream_response_time}s';
    access_log /dev/stdout tx;

    proxy_cache_path /tmp/nginx-tx-cache levels=1:2 keys_zone=tx:32m
                     max_size=2g inactive=8h use_temp_path=off;

    server {
        listen 80;

        # Gross genug, dass $request_body gefuellt bleibt (siehe Punkt 2 oben).
        client_body_buffer_size 2m;
        client_max_body_size 8m;

        proxy_ssl_server_name on;
        proxy_ssl_certificate /etc/nginx/certs/client-cert.pem;
        proxy_ssl_certificate_key /etc/nginx/certs/client-key.key;

        location / {
            proxy_pass https://ontoserver.mii-termserv.de;

            proxy_connect_timeout 30s;
            proxy_send_timeout   300s;
            proxy_read_timeout   300s;

            proxy_cache tx;
            proxy_cache_methods GET HEAD POST;
            proxy_cache_key "$request_method$request_uri|$request_body";
            proxy_cache_valid 200 8h;
            # Der Kern (Punkt 3): Upstream-Anfrage zu Ende fuehren und die
            # Antwort cachen, auch wenn der Validator schon aufgegeben hat.
            # Sein naechster Versuch trifft dann den Cache.
            proxy_ignore_client_abort on;
            proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
            add_header X-Cache-Status $upstream_cache_status always;
        }
    }
}
