# mTLS-Proxy zum MII-Terminologieserver (SU-TermServ) — Muster aus
# kerndatensatz-meta/.github/workflows/nginx.conf, hier gepinnt vendored,
# damit kein Lauf von @master-Aenderungen abhaengt.
# Client verbindet sich mit http://127.0.0.1:8090, der Proxy terminiert die
# Client-Zertifikat-Authentifizierung gegen ontoserver.mii-termserv.de.
events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;

    # Das CapabilityStatement von Ontoserver ist gross und wird langsam
    # ausgeliefert. Der Java-Validator laeuft deshalb beim Initialisieren in
    # seinen EIGENEN Client-Timeout (okio SocketAsyncTimeout) und bricht ab,
    # bevor er eine einzige Ressource ansieht — waehrend ein `curl` ohne
    # --max-time geduldig wartet und den Endpunkt als gesund meldet. Genau
    # diese Asymmetrie hat den Readiness-Check gruen und den Validator rot
    # aussehen lassen.
    # Abhilfe: nginx haelt die Antwort vor. Der Warmlauf im Workflow fuellt
    # den Cache, der Validator bekommt sie danach sofort.
    proxy_cache_path /tmp/nginx-tx-cache levels=1:2 keys_zone=tx:16m
                     max_size=256m inactive=2h use_temp_path=off;

    server {
        listen 80;

        # Grosszuegige Obergrenzen: der Proxy soll nie vor dem Server aufgeben.
        proxy_connect_timeout 30s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        location / {
            client_max_body_size 5m;
            proxy_pass https://ontoserver.mii-termserv.de;
            proxy_ssl_server_name on;

            proxy_ssl_certificate /etc/nginx/certs/client-cert.pem;
            proxy_ssl_certificate_key /etc/nginx/certs/client-key.key;

            # Terminologie-Antworten sind fuer die Dauer eines Laufs stabil.
            # proxy_cache_lock buendelt parallele Anfragen auf dieselbe
            # Ressource zu einem einzigen Upstream-Request.
            proxy_cache tx;
            proxy_cache_valid 200 2h;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 300s;
            proxy_cache_methods GET HEAD;
            proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
            add_header X-Cache-Status $upstream_cache_status always;
        }
    }
}
