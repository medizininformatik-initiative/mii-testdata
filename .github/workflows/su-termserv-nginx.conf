# mTLS-Proxy zum MII-Terminologieserver (SU-TermServ) — Muster aus
# kerndatensatz-meta/.github/workflows/nginx.conf, hier gepinnt vendored,
# damit kein Lauf von @master-Aenderungen abhaengt.
# Client verbindet sich mit http://127.0.0.1:8090, der Proxy terminiert die
# Client-Zertifikat-Authentifizierung gegen ontoserver.mii-termserv.de.
events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;

    # Genau eine Antwort wird vorgehalten: das CapabilityStatement.
    #
    # Es ist gross und wird langsam ausgeliefert, und der Java-Validator laeuft
    # beim Initialisieren in seinen EIGENEN Client-Timeout (okio
    # SocketAsyncTimeout) — waehrend ein `curl` ohne --max-time geduldig wartet
    # und denselben Endpunkt als gesund meldet. Diese Asymmetrie hat den
    # Readiness-Check gruen und den Validator rot aussehen lassen.
    proxy_cache_path /tmp/nginx-tx-cache levels=1:2 keys_zone=tx:4m
                     max_size=64m inactive=2h use_temp_path=off;

    server {
        listen 80;
        client_max_body_size 5m;

        proxy_ssl_server_name on;
        proxy_ssl_certificate /etc/nginx/certs/client-cert.pem;
        proxy_ssl_certificate_key /etc/nginx/certs/client-key.key;

        # Der Normalfall: durchreichen, nicht cachen, zuegig aufgeben.
        #
        # Die erste Fassung dieses Caches hat auf `location /` gegriffen, mit
        # proxy_cache_lock und 300s Timeouts. Das hat die Validierung von 12 auf
        # ueber 45 Minuten gebracht, bis sie in den Job-Deckel lief — aus zwei
        # Gruenden, die sich verstaerken:
        #
        #   1. Der Validator fragt Terminologie per POST ($validate-code,
        #      $expand mit Parameters-Body). proxy_cache_methods kennt nur
        #      GET/HEAD, gecacht wurde davon also praktisch nichts.
        #   2. proxy_cache_lock buendelt parallele Anfragen auf EINEN
        #      Upstream-Request — die uebrigen warten. Mit
        #      proxy_cache_lock_timeout 300s und proxy_read_timeout 300s wartete
        #      damit jede langsame Anfrage bis zu fuenf Minuten, statt schnell zu
        #      scheitern und den Validator weiterlaufen zu lassen.
        #
        # Der Cache hat also fast nichts beschleunigt und alles verlangsamt.
        # Er steht jetzt nur noch dort, wo er das Problem tatsaechlich loest.
        location / {
            proxy_pass https://ontoserver.mii-termserv.de;
            proxy_connect_timeout 15s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
        }

        # Das CapabilityStatement: einmal holen, dann aus dem Cache. Hier darf
        # lange gewartet werden — es passiert genau einmal, der Warmlauf des
        # Readiness-Checks fuellt den Cache, und der Validator bekommt die
        # Antwort danach sofort.
        location = /fhir/metadata {
            proxy_pass https://ontoserver.mii-termserv.de;
            proxy_connect_timeout 30s;
            proxy_send_timeout    300s;
            proxy_read_timeout    300s;

            proxy_cache tx;
            proxy_cache_valid 200 2h;
            proxy_cache_methods GET HEAD;
            proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
            add_header X-Cache-Status $upstream_cache_status always;
        }
    }
}
