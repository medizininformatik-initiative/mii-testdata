# mTLS-Proxy zum MII-Terminologieserver (SU-TermServ) — Muster aus
# kerndatensatz-meta/.github/workflows/nginx.conf, hier gepinnt vendored,
# damit kein Lauf von @master-Aenderungen abhaengt.
# Client verbindet sich mit http://127.0.0.1:8090, der Proxy terminiert die
# Client-Zertifikat-Authentifizierung gegen ontoserver.mii-termserv.de.
#
# VERBINDUNGEN WERDEN WIEDERVERWENDET, und das ist der Kern dieser Datei.
#
# nginx spricht per Default HTTP/1.0 zum Upstream und schliesst die Verbindung
# nach jeder Anfrage. Bei mTLS bedeutet das PRO ANFRAGE einen vollstaendigen
# TLS-Handshake mit Client-Zertifikat — von einem GitHub-Runner nach
# Deutschland. Eine Validierung stellt mehrere Tausend Terminologieanfragen;
# der Handshake-Aufwand summiert sich damit zu Stunden, die nichts mit dem
# Server zu tun haben.
#
# Dass der Server selbst schnell ist, ist gemessen: Gegen einen
# SU-TermServ-Zugang ohne diese Engstelle antwortet ein
# `CodeSystem/$validate-code` in **0,15 Sekunden** (fuenf Messungen, ATC).
# In der CI brauchten dagegen einzelne Ressourcen bis zu 8:48, und ein
# Vollauf schaffte in 120 Minuten elf von 1369 Ressourcen (Lauf
# 36258544207). Diese Luecke ist mit der Rechenzeit des Servers nicht zu
# erklaeren, mit Verbindungsaufbau schon.
#
# EHRLICHERWEISE: Das ist eine begruendete Hypothese, keine Messung — mTLS
# laesst sich lokal nicht nachstellen, weil das Zertifikat nur als Org-Secret
# vorliegt. Sie passt aber auf alle Beobachtungen, erklaert nebenbei, warum ein
# Antwort-Cache so wenig brachte (die Kosten stecken in der Verbindung, nicht in
# der Berechnung), und kostet nichts. Der naechste Lauf zeigt, ob sie traegt;
# die Zahl steht dann hier.
events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;

    # Ein benannter Upstream ist Voraussetzung fuer `keepalive` — an einem
    # `proxy_pass` mit Literal-URL greift die Direktive nicht.
    upstream su_termserv {
        server ontoserver.mii-termserv.de:443;
        # Offene Verbindungen je Worker. Der Validator fragt seriell, ein
        # kleiner Vorrat genuegt; die Zahl ist die Obergrenze, keine Vorgabe.
        keepalive 16;
        # Standard sind 1000 Anfragen je Verbindung — danach wuerde der
        # Handshake wiederkehren, und genau den wollen wir loswerden.
        keepalive_requests 100000;
        keepalive_timeout 300s;
    }

    server {
        listen 80;
        client_max_body_size 5m;

        location / {
            proxy_pass https://su_termserv;

            # Ohne diese zwei Zeilen bleibt es bei HTTP/1.0 und
            # `Connection: close` — der Upstream-Keepalive waere wirkungslos.
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Bei einem benannten Upstream leitet nginx SNI und Host-Header
            # sonst aus dem Upstream-NAMEN ab ("su_termserv"), nicht aus dem
            # Servernamen — das bricht TLS und Routing.
            proxy_set_header Host ontoserver.mii-termserv.de;
            proxy_ssl_name ontoserver.mii-termserv.de;
            proxy_ssl_server_name on;
            # Auch der TLS-Sitzungswiederaufbau spart Handshakes, falls die
            # Verbindung doch einmal neu aufgebaut werden muss.
            proxy_ssl_session_reuse on;

            proxy_ssl_certificate /etc/nginx/certs/client-cert.pem;
            proxy_ssl_certificate_key /etc/nginx/certs/client-key.key;
        }
    }
}
